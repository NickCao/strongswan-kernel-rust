[package]
name = "kernel-rust-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
rustix = { version = "1.1", features = ["net"] }
nix = { version = "0.31", features = ["socket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_derive = "1"
varlink = "=13.0.0"
zeroize = "1.8"

[build-dependencies]
varlink_generator = "=13.0.0"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
