[package]
name = "kernel-rust-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
zeroize = "1.8"
tarpc = { version = "0.38", features = ["serde-transport-bincode", "unix"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
futures = "0.3"
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
