[package]
name = "charon-kernel-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "External Linux kernel backend for strongSwan"
publish = false

[dependencies]
libc = "0.2"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_derive = "1"
varlink = "=13.0.0"

[build-dependencies]
varlink_generator = "=13.0.0"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
