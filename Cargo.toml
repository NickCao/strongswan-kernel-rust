[package]
name = "charon-kernel-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "GPL-2.0-or-later"
description = "External Linux kernel backend for strongSwan"
publish = false
default-run = "charon-kernel-daemon"

[workspace]
members = ["plugin", "protocol"]
default-members = ["."]
resolver = "2"

[dependencies]
libc = "0.2"
kernel-rust-protocol = { path = "protocol" }
rustix = { version = "1.1", features = ["net", "process", "fs", "time", "system", "event"] }
nix = { version = "0.31", features = ["user", "signal"] }
neli = { version = "0.7.5", default-features = false, features = ["async"] }
ipnet = "2.12.2"
netlink-packet-xfrm = "0.5.0"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
clap = { version = "4.6.7", features = ["derive"] }
sd-notify = "0.5.0"
tarpc = { version = "0.38", features = ["serde-transport-bincode", "unix"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros", "io-util", "io-std"] }
futures = "0.3"

[dev-dependencies]
nix = { version = "0.31", features = ["sched"] }
rstest = { version = "0.28", default-features = false }
tempfile = "3"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
