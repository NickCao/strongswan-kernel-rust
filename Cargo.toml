[package]
name = "charon-kernel-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "GPL-2.0-or-later"
description = "External Linux kernel backend for strongSwan"
publish = false
default-run = "charon-kernel-daemon"

[workspace]
members = ["plugin", "protocol"]
default-members = ["."]
resolver = "2"

[features]
test-client = ["dep:serde_json"]

[[bin]]
name = "kernel-rpc-test-client"
path = "tests/support/rpc_client.rs"
required-features = ["test-client"]

[dependencies]
libc = "0.2"
serde_json = { version = "1", optional = true }
kernel-rust-protocol = { path = "protocol" }
rustix = { version = "1.1", features = ["net", "process", "fs", "time", "system", "event"] }
nix = { version = "0.31", features = ["user", "signal"] }
neli = "0.7.4"
rand = "0.10.3"
ipnet = "2.12.2"
netlink-packet-xfrm = "0.5.0"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
clap = { version = "4.6.7", features = ["derive"] }
sd-notify = "0.5.0"
tarpc = { version = "0.38", features = ["serde-transport-bincode", "unix"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util", "io-std"] }
futures = "0.3"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
