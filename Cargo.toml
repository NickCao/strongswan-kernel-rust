[package]
name = "charon-kernel-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "GPL-2.0-or-later"
description = "External Linux kernel backend for strongSwan"
publish = false

[workspace]
members = ["plugin", "protocol"]
default-members = ["."]
resolver = "2"

[dependencies]
libc = "0.2"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
varlink = "=13.0.0"
kernel-rust-protocol = { path = "protocol" }
rustix = { version = "1.1", features = ["net", "process", "fs", "time"] }
nix = { version = "0.31", features = ["user"] }
neli = "0.7.4"
rand = "0.10.3"
ipnet = "2.12.2"
hex = "0.4.3"
netlink-packet-xfrm = "0.5.0"
netlink-packet-core = "0.9.0"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
